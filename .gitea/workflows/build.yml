name: 编译模组

on:
  push:
    branches: [ "main", "master", "1.20.1" ]

jobs:
  build-mod:
    runs-on: ubuntu-latest

    env:
      GITHUB_SERVER_URL: http://172.18.0.2:3000
      GITEA_SERVER_URL: http://172.18.0.2:3000

    container:
      image: gradle:8.5-jdk17-jammy

    steps:
      - name: 0. URL 偷天换日（内网强制短接）
        run: git config --global url."http://172.18.0.2:3000/".insteadOf "https://git.momu2.com/"

      - name: 1. 检出代码
        run: |
          git clone "http://172.18.0.2:3000/$GITHUB_REPOSITORY.git" .
          git checkout "$GITHUB_REF_NAME"

      - name: 2. 准备 Gradle 缓存目录
        run: mkdir -p "$HOME/.gradle"

      - name: 3. 编译 Forge 模组
        run: gradle build --no-daemon --stacktrace

      - name: 4. 收集 JAR
        run: |
          mkdir -p ./dist
          find . -path "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-all.jar" -exec cp {} ./dist/ \;
          echo "=== 编译产物 ==="
          ls -lh ./dist/

      - name: 5. 上传到 Release
        run: |
          TAG="build-$(date +%Y%m%d-%H%M%S)"
          echo "Tag: $TAG"

          RESP=$(curl -sS -X POST \
            -H "Authorization: token $ACTIONS_RUNTIME_TOKEN" \
            -H "Content-Type: application/json" \
            "http://172.18.0.2:3000/api/v1/repos/$GITHUB_REPOSITORY/releases" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"构建 #$GITHUB_RUN_NUMBER\",\"body\":\"自动编译于 $GITHUB_SHA\"}")
          echo "$RESP"

          RELEASE_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          echo "Release ID: $RELEASE_ID"

          for JAR in ./dist/*.jar; do
            echo "上传: $JAR"
            curl -sS -X POST \
              -H "Authorization: token $ACTIONS_RUNTIME_TOKEN" \
              -F "attachment=@$JAR" \
              "http://172.18.0.2:3000/api/v1/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets"
          done
          echo "上传完成！"
